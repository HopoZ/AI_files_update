name: Build Bundle Executable

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build bundle.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tkinterdnd2

      - name: Build executable with PyInstaller
        working-directory: .
        run: |
          pyinstaller --onefile --windowed --name bundle --distpath . --collect-all tkinterdnd2 bundle.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-executable
          path: bundle.exe

      - name: Create GitHub release and attach executable
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bundle.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
